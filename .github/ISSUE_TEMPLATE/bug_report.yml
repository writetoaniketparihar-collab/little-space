name: Bug report
description: Report a problem using fictional note content.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Issues and attachments are public. Do not include private notes, vaults, passwords, receipts, customer download links or unreviewed logs. Use hello@littlespace.pro for private help. Report security vulnerabilities privately using SECURITY.md.
  - type: input
    id: app_version
    attributes:
      label: Little Space version
      placeholder: Find the version in About Little Space
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: Find the version in About This Mac
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use fictional note text. Do not include personal file paths or private links.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and any attachments for private or sensitive information.
          required: true
