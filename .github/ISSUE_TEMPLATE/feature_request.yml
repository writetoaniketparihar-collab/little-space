name: Feature request
description: Explain a problem you want Little Space to solve.
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: This request is public. Use fictional examples and remove private information from attachments.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem and your current workaround.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
    validations:
      required: true
